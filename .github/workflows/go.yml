name: Go

on:
  push:
    branches: [feat-pro]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector and coverage
        run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Check coverage
        run: |
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); if ($3 < 60) exit 1; found=1 } END { if (!found) exit 1 }'
      - name: Vet
        run: go vet ./...
